<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>سجل التأخيرات</title>

    <link rel="stylesheet"
          href="records.css">

    <style>
        #studentSummary {
            margin-top: 15px;
        }

        .summary-card {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: #eef0fd;
            color: #333;
        }

        .summary-card.danger {
            background: #fdecec;
            border: 1px solid #f5b5b5;
        }

        .summary-name {
            font-weight: bold;
        }

        .summary-counts span {
            display: inline-block;
            margin-right: 12px;
        }

        .cumulative-cell {
            font-weight: bold;
            color: #4f46a5;
        }

        .summary-warning {
            width: 100%;
            color: #c62828;
            font-weight: bold;
        }
    </style>

</head>


<body>


<div class="records-container">

    <div class="records-card">

        <h1>📋 سجل التأخيرات</h1>

        <p>
            جميع الطالبات المتأخرات
        </p>


        <!-- البحث -->

        <input
            type="text"
            id="searchInput"
            placeholder="ابحثي باسم الطالبة"
        >


        <!-- فلترة الصف -->

        <select id="classFilter">

            <option value="">
                كل الصفوف
            </option>

            <option>سابع أ</option>
                <option>سابع ب</option>
                <option>سابع ج</option>

                <option value="ثامن أ">ثامن أ</option>
                <option value="ثامن ب">ثامن ب</option>
                <option value="ثامن ج">ثامن ج</option>

                <option value="تاسع أ">تاسع أ</option>
                <option value="تاسع ب">تاسع ب</option>
                <option value="تاسع ج">تاسع ج</option>

                <option value="عاشر أ">عاشر أ</option>
                <option value="عاشر ب">عاشر ب</option>

                <option value="اول ثانوي أ"> حادي عشر أ</option>
                <option value="اول ثانوي ب"> حادي عشر ب</option>

                <option value="توجيهي صحي أ">ثاني عشر صحي أ</option>
                <option value="توجيهي صحي ب">ثاني عشر صحي ب</option>
                <option value="توجيهي لغات">ثاني عشر لغات</option>
                
                <option value="عاشر تكنولوجيا">عاشر تكنولوجيا</option>
                <option value="اول ثانوي تكنولوجيا">حادي عشر تكنولوجيا</option>
                <option value="توجيهي تكنولوجيا">ثاني عشر تكنولوجيا</option>

                <option value="عاشر أعمال">عاشر أعمال</option>
                <option value="اول ثانوي أعمال">حادي عشر أعمال</option>
                <option value="توجيهي إدارة اعمال">
                    ثاني عشر ادارة أعمال
                </option>

        </select>


        <!-- ملخص تأخيرات الطالبة عند البحث -->

        <div id="studentSummary"></div>


        <!-- الجدول -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>
                            الطالبة
                        </th>

                        <th>
                            الصف
                        </th>

                        <th>
                            عدد التأخيرات
                            <br>
                            <small>(تراكمي)</small>
                        </th>

                        <th>
                            التاريخ
                        </th>

                        <th>
                            الوقت
                        </th>

                        <th>
                            السبب
                        </th>

                        <th>
                            المعلمة
                        </th>

                    </tr>

                </thead>


                <tbody id="recordsTable">

                </tbody>

            </table>

        </div>


        <p id="noRecords">
            لا يوجد سجلات حاليًا.
        </p>


        <p id="loadingMessage">
            ⏳ جاري تحميل السجلات...
        </p>


        <button
            onclick="window.location.href='dashboard.html'">

            ← رجوع

        </button>

    </div>

</div>



<script type="module">

    // ========================================
    // Firebase
    // ========================================

    import { db } from "./firebase.js";


    import {
        collection,
        getDocs,
        query,
        orderBy
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ========================================
    // عناصر الصفحة
    // ========================================

    const table =
        document.getElementById(
            "recordsTable"
        );


    const noRecords =
        document.getElementById(
            "noRecords"
        );


    const loadingMessage =
        document.getElementById(
            "loadingMessage"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const classFilter =
        document.getElementById(
            "classFilter"
        );


    // جميع السجلات
    let records = [];



    // ========================================
    // تحميل السجلات من Firebase
    // ========================================

    async function loadRecords() {

        try {

            loadingMessage.style.display =
                "block";

            noRecords.style.display =
                "none";


            console.log(
                "جاري تحميل سجلات التأخير..."
            );


            const recordsQuery =
                query(

                    collection(
                        db,
                        "lateRecords"
                    ),

                    orderBy(
                        "createdAt",
                        "desc"
                    )

                );


            const snapshot =
                await getDocs(
                    recordsQuery
                );


            console.log(
                "عدد السجلات:",
                snapshot.size
            );


            records = [];


            snapshot.forEach(
                function (doc) {

                    const data =
                        doc.data();


                    records.push({

                        id: doc.id,

                        ...data

                    });

                }
            );


            loadingMessage.style.display =
                "none";


            addCumulativeCounts();

            displayRecords();


        } catch (error) {

            console.error(
                "Firebase Error:",
                error
            );


            loadingMessage.textContent =
                "❌ حدث خطأ أثناء تحميل السجلات";


            loadingMessage.style.color =
                "red";

        }

    }



    // ========================================
    // عرض السجلات
    // ========================================

    function displayRecords() {

        table.innerHTML = "";


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const selectedClass =
            classFilter.value;


        // تطبيق البحث والفلترة
        const filtered =
            records.filter(
                function (record) {

                    const name =
                        String(
                            record.studentName || ""
                        ).toLowerCase();


                    const className =
                        String(
                            record.className || ""
                        );


                    const matchesName =
                        name.includes(
                            search
                        );


                    const matchesClass =
                        selectedClass === ""
                        ||
                        className === selectedClass;


                    return (
                        matchesName &&
                        matchesClass
                    );

                }
            );



        // ملخص عدد التأخيرات للطالبة عند البحث
        showSummary(search, filtered);


        // لا توجد نتائج
        if (filtered.length === 0) {

            noRecords.style.display =
                "block";

            return;

        }


        noRecords.style.display =
            "none";



        // إنشاء الصفوف
        filtered.forEach(
            function (record, index) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${record.studentName || "-"}
                    </td>

                    <td>
                        ${record.className || "-"}
                    </td>

                    <td class="cumulative-cell">
                        ${record.cumulative || "-"}
                    </td>

                    <td>
                        ${record.date || "-"}
                    </td>

                    <td>
                        ${record.time || "-"}
                    </td>

                    <td>
                        ${record.reason || "-"}
                    </td>

                    <td>
                        ${record.teacher || "-"}
                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );

    }



    // ========================================
    // العدد التراكمي لتأخيرات كل طالبة
    // (هذا التأخير رقم كم للطالبة)
    // ========================================

    function addCumulativeCounts() {

        const counts = {};

        // السجلات مرتبة من الأحدث، فنبدأ من الأقدم
        for (let i = records.length - 1; i >= 0; i--) {

            const record = records[i];

            const key =
                String(record.studentName || "") + "|" +
                String(record.className || "");

            counts[key] = (counts[key] || 0) + 1;

            record.cumulative = counts[key];
        }
    }



    // ========================================
    // ملخص عدد تأخيرات الطالبة
    // ========================================

    // حد التنبيه خلال الشهر
    const LATE_LIMIT = 3;

    const summaryBox =
        document.getElementById("studentSummary");


    function normalizeDigits(value) {
        return String(value ?? "")
            .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
            .replace(/[\u200e\u200f\u202a-\u202e]/g, "");
    }


    function getMonthYear(record) {

        if (record.createdAt &&
            typeof record.createdAt.toDate === "function") {
            const d = record.createdAt.toDate();
            return { month: d.getMonth() + 1, year: d.getFullYear() };
        }

        const parts = normalizeDigits(record.date)
            .match(/(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*[\/.-]\s*(\d{4})/);

        if (parts) {
            return { month: Number(parts[2]), year: Number(parts[3]) };
        }

        return null;
    }


    function showSummary(search, filtered) {

        summaryBox.replaceChildren();

        // الملخص يظهر فقط عند كتابة اسم في البحث
        if (search === "") return;

        const now = new Date();
        const groups = {};

        filtered.forEach(function (record) {

            const name = String(record.studentName || "-");
            const cls = String(record.className || "-");
            const key = name + "|" + cls;

            if (!groups[key]) {
                groups[key] = { name, cls, total: 0, month: 0 };
            }

            groups[key].total++;

            const my = getMonthYear(record);

            if (my &&
                my.month === now.getMonth() + 1 &&
                my.year === now.getFullYear()) {
                groups[key].month++;
            }
        });


        Object.values(groups).forEach(function (g) {

            const card = document.createElement("div");
            card.className = "summary-card";

            const name = document.createElement("div");
            name.className = "summary-name";
            name.textContent = "👩‍🎓 " + g.name + " — " + g.cls;

            const counts = document.createElement("div");
            counts.className = "summary-counts";

            const total = document.createElement("span");
            total.textContent = "مجموع التأخيرات: " + g.total;

            const month = document.createElement("span");
            month.textContent = "هذا الشهر: " + g.month;

            counts.append(total, month);
            card.append(name, counts);

            if (g.month > LATE_LIMIT) {

                card.classList.add("danger");

                const warn = document.createElement("div");
                warn.className = "summary-warning";
                warn.textContent =
                    "⚠️ تجاوزت " + LATE_LIMIT +
                    " تأخيرات هذا الشهر، يُرجى متابعتها مع الإدارة أو المرشدة.";

                card.appendChild(warn);
            }

            summaryBox.appendChild(card);
        });
    }



    // ========================================
    // البحث باسم الطالبة
    // ========================================

    searchInput.addEventListener(
        "input",
        displayRecords
    );



    // ========================================
    // فلترة حسب الصف
    // ========================================

    classFilter.addEventListener(
        "change",
        displayRecords
    );



    // ========================================
    // تشغيل تحميل السجلات
    // ========================================

    loadRecords();

</script>



<footer class="site-footer">

© جميع الحقوق محفوظة<br>
    تصميم وتطوير سالي موسى العمرات
</footer>


</body>

</html>
