<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام متابعة تأخير الطالبات</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="school-icon">🏫</div>
        <h1>مدرسة كفرسوم الثانوية المختلطة</h1>

        <h2>نظام متابعة التأخير</h2>
        <br>

        <p class="subtitle">تسجيل الدخول </p>

        <form id="loginForm">

            <label for="teacherName">اسم المعلمة</label>
            <input
                type="text"
                id="teacherName"
                placeholder="أدخلي اسمك"
                autocomplete="name"
                required
            >

            <label for="username">البريد الإلكتروني</label>
            <input
                type="email"
                id="username"
                placeholder="أدخلي البريد الإلكتروني"
                autocomplete="email"
                required
            >

            <label for="password">كلمة المرور</label>
            <input 
                type="password" 
                id="password" 
                placeholder="أدخل كلمة المرور"
                required
            >

            <button type="submit">دخول</button>

            <p id="message"></p>

        </form>

    </div>
<script type="module" src="app.js"></script>
 
   <footer class="site-footer">
© جميع الحقوق محفوظة<br>
    تصميم وتطوير سالي موسى العمرات</footer>

</body>
</html>
