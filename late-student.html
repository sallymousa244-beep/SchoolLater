<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل طالبة متأخرة</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .student-select {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            outline: none;
        }

        .student-select:focus {
            border-color: #667eea;
        }

        .student-select:disabled {
            background: #f3f3f3;
            color: #888;
            cursor: not-allowed;
        }

        #lateWarning {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            text-align: center;
            line-height: 1.6;
        }

        #lateWarning.info {
            background: #eef0fd;
            color: #4f46a5;
        }

        #lateWarning.danger {
            background: #fdecec;
            color: #c62828;
            border: 1px solid #f5b5b5;
        }

        #successMessage {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="late-container">

    <div class="form-card">

        <h1>📝 تسجيل طالبة متأخرة</h1>

        <p class="subtitle">
            أدخلي بيانات الطالبة
        </p>

        <form id="lateForm">

            <!-- اسم المعلمة -->
            <label for="teacherName">
                اسم المعلمة
            </label>

            <input
                type="text"
                id="teacherName"
                readonly
            >


            <!-- الصف -->
            <label for="className">
                الصف
            </label>

            <select id="className" required>

                <option value="">
                    اختاري الصف
                </option>

                <option value="سابع أ">سابع أ</option>
                <option value="سابع ب">سابع ب</option>
                <option value="سابع ج">سابع ج</option>

                <option value="ثامن أ">ثامن أ</option>
                <option value="ثامن ب">ثامن ب</option>
                <option value="ثامن ج">ثامن ج</option>

                <option value="تاسع أ">تاسع أ</option>
                <option value="تاسع ب">تاسع ب</option>
                <option value="تاسع ج">تاسع ج</option>

                <option value="عاشر أ">عاشر أ</option>
                <option value="عاشر ب">عاشر ب</option>

                <option value="اول ثانوي أ"> حادي عشر أ</option>
                <option value="اول ثانوي ب"> حادي عشر ب</option>

                <option value="توجيهي صحي أ">ثاني عشر صحي أ</option>
                <option value="توجيهي صحي ب">ثاني عشر صحي ب</option>
                <option value="توجيهي لغات">ثاني عشر لغات</option>
                
                <option value="عاشر تكنولوجيا">عاشر تكنولوجيا</option>
                <option value="اول ثانوي تكنولوجيا">حادي عشر تكنولوجيا</option>
                <option value="توجيهي تكنولوجيا">ثاني عشر تكنولوجيا</option>

                <option value="عاشر أعمال">عاشر أعمال</option>
                <option value="اول ثانوي أعمال">حادي عشر أعمال</option>
                <option value="توجيهي إدارة اعمال">
                    ثاني عشر ادارة أعمال
                </option>

            </select>


            <!-- اسم الطالبة -->
            <label for="studentName">
                اسم الطالبة
            </label>

            <select
                id="studentName"
                class="student-select"
                required
                disabled
            >

                <option value="">
                    اختاري الصف أولاً
                </option>

            </select>


            <!-- سبب التأخير -->
            <label for="lateReason">
                سبب التأخير
            </label>

            <select id="lateReason">

                <option value="">
                   اختيار
                </option>

                <option value="المواصلات">
                    المواصلات
                </option>

                <option value="الازدحام">
                    الازدحام
                </option>

                <option value="ظرف عائلي">
                    ظرف عائلي
                </option>

                <option value="أسباب أخرى">
                    أسباب أخرى
                </option>
                <option value=" بدون سبب">
                     بدون سبب
                </option>

            </select>


            <!-- وقت التسجيل -->
            <label for="lateTime">
                وقت التسجيل
            </label>

            <input
                type="text"
                id="lateTime"
                readonly
            >


            <!-- حفظ -->
            <button
                type="submit"
                id="saveButton">

                💾 حفظ التأخير

            </button>

        </form>


        <p id="successMessage"></p>

        <p id="lateWarning"></p>


        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'">

            ← الرجوع للصفحة الرئيسية

        </button>

    </div>

</div>


<script type="module">

    import { db } from "./firebase.js";

    import {
        collection,
        addDoc,
        serverTimestamp,
        query,
        where,
        getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ========================================
    // حد التنبيه: إذا زاد عدد تأخيرات الطالبة
    // خلال الشهر عن هذا الرقم يظهر تنبيه
    // ========================================

    const LATE_LIMIT = 3;


    // تحويل الأرقام العربية إلى إنجليزية
    function normalizeDigits(value) {
        return String(value ?? "")
            .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
            .replace(/[\u200e\u200f\u202a-\u202e]/g, "");
    }


    // معرفة شهر وسنة السجل
    function getMonthYear(record) {

        if (record.createdAt &&
            typeof record.createdAt.toDate === "function") {
            const d = record.createdAt.toDate();
            return { month: d.getMonth() + 1, year: d.getFullYear() };
        }

        const parts = normalizeDigits(record.date)
            .match(/(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*[\/.-]\s*(\d{4})/);

        if (parts) {
            return { month: Number(parts[2]), year: Number(parts[3]) };
        }

        return null;
    }


    // عرض عدد تأخيرات الطالبة هذا الشهر وتنبيه إذا تجاوزت الحد
    async function showMonthlyCount(studentName, className) {

        const warning =
            document.getElementById("lateWarning");

        warning.style.display = "none";

        try {

            const snapshot = await getDocs(
                query(
                    collection(db, "lateRecords"),
                    where("studentName", "==", studentName)
                )
            );

            const now = new Date();

            let count = 0;

            snapshot.forEach(function (doc) {

                const record = doc.data();

                if (record.className !== className) return;

                const my = getMonthYear(record);

                if (my &&
                    my.month === now.getMonth() + 1 &&
                    my.year === now.getFullYear()) {
                    count++;
                }
            });


            warning.className = "";

            if (count > LATE_LIMIT) {

                warning.className = "danger";

                warning.textContent =
                    "⚠️ تنبيه: الطالبة " + studentName +
                    " تأخرت " + count +
                    " مرات هذا الشهر (أكثر من " + LATE_LIMIT + " مرات). يُرجى متابعتها مع الإدارة أو المرشدة.";

                alert(warning.textContent);

            } else {

                warning.className = "info";

                warning.textContent =
                    "عدد تأخيرات الطالبة " + studentName +
                    " هذا الشهر: " + count;
            }

            warning.style.display = "block";

        } catch (error) {

            console.error("خطأ في حساب عدد التأخيرات:", error);
        }
    }


    // ========================================
    // عناصر الصفحة
    // ========================================

    const lateForm =
        document.getElementById("lateForm");

    const classSelect =
        document.getElementById("className");

    const studentSelect =
        document.getElementById("studentName");

    const timeInput =
        document.getElementById("lateTime");

    const successMessage =
        document.getElementById("successMessage");

    const saveButton =
        document.getElementById("saveButton");

    const teacherInput =
        document.getElementById("teacherName");


    // اسم المعلمة من صفحة الدخول
    const savedTeacher =
        localStorage.getItem("username");

    // إذا ما في اسم محفوظ، المعلمة تكتبه هون مرة وحدة
    if (savedTeacher) {

        teacherInput.value = savedTeacher;

    } else {

        teacherInput.readOnly = false;
        teacherInput.required = true;
        teacherInput.placeholder = "أدخلي اسمك";

    }


    console.log("الكود اشتغل ✅");


    // ========================================
    // تحميل الطالبات حسب الصف
    // ========================================

    classSelect.addEventListener("change", async function () {

        const selectedClass =
            classSelect.value;

        console.log(
            "الصف المختار:",
            selectedClass
        );


        // تنظيف قائمة الطالبات
        studentSelect.innerHTML = "";

        // تعطيلها أثناء التحميل
        studentSelect.disabled = true;


        // إذا لم يتم اختيار صف
        if (!selectedClass) {

            const option =
                document.createElement("option");

            option.value = "";

            option.textContent =
                "اختاري الصف أولاً";

            studentSelect.appendChild(option);

            return;
        }


        // رسالة التحميل
        const loadingOption =
            document.createElement("option");

        loadingOption.value = "";

        loadingOption.textContent =
            "⏳ جاري تحميل الطالبات...";

        studentSelect.appendChild(
            loadingOption
        );


        try {

            console.log(
                "جاري البحث في Firebase..."
            );


            // البحث في مجموعة students
            // اسم حقل الصف في Firebase هو class
            const studentsQuery =
                query(
                    collection(
                        db,
                        "students"
                    ),

                    where(
                        "class",
                        "==",
                        selectedClass
                    )
                );


            const snapshot =
                await getDocs(
                    studentsQuery
                );


            console.log(
                "عدد الطالبات:",
                snapshot.size
            );


            // تنظيف القائمة
            studentSelect.innerHTML = "";


            // الخيار الأول
            const firstOption =
                document.createElement("option");

            firstOption.value = "";

            firstOption.textContent =
                "اختاري اسم الطالبة";

            studentSelect.appendChild(
                firstOption
            );


            // إذا لم توجد طالبات
            if (snapshot.empty) {

                const emptyOption =
                    document.createElement("option");

                emptyOption.value = "";

                emptyOption.textContent =
                    "لا توجد طالبات لهذا الصف";

                studentSelect.appendChild(
                    emptyOption
                );

                return;
            }


            // مصفوفة أسماء الطالبات
            const students = [];


            snapshot.forEach(
                function (doc) {

                    const data =
                        doc.data();

                    console.log(
                        "بيانات الطالبة:",
                        data
                    );


                    // اسم الطالبة موجود في name
                    if (data.name) {

                        students.push(
                            data.name
                        );

                    }

                }
            );


            // ترتيب الأسماء
            students.sort(
                function (a, b) {

                    return a.localeCompare(
                        b,
                        "ar"
                    );

                }
            );


            // إضافة الأسماء للقائمة
            students.forEach(
                function (studentName) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        studentName;

                    option.textContent =
                        studentName;

                    studentSelect.appendChild(
                        option
                    );

                }
            );


            // تفعيل القائمة
            studentSelect.disabled = false;


            console.log(
                "تم عرض الطالبات بنجاح ✅"
            );


        } catch (error) {

            console.error(
                "خطأ في تحميل الطالبات:",
                error
            );


            studentSelect.innerHTML = "";


            const errorOption =
                document.createElement("option");

            errorOption.value = "";

            errorOption.textContent =
                "❌ حدث خطأ في تحميل الطالبات";

            studentSelect.appendChild(
                errorOption
            );

        }

    });


    // ========================================
    // تحديث الوقت
    // ========================================

    function updateTime() {

        const now =
            new Date();

        timeInput.value =
            now.toLocaleTimeString(
                "ar-JO"
            );

    }


    updateTime();

    setInterval(
        updateTime,
        1000
    );


    // ========================================
    // حفظ التأخير
    // ========================================

    lateForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const className =
                classSelect.value;


            const studentName =
                studentSelect.value;


            const reason =
                document
                    .getElementById(
                        "lateReason"
                    )
                    .value;


            const teacherName =
                teacherInput.value.trim();


            // التأكد من اسم المعلمة
            if (!teacherName) {

                alert(
                    "⚠️ أدخلي اسم المعلمة"
                );

                teacherInput.focus();

                return;
            }


            // حفظ الاسم لحد ما تسجل خروج
            localStorage.setItem(
                "username",
                teacherName
            );

            teacherInput.readOnly = true;


            // التأكد من الصف
            if (!className) {

                alert(
                    "⚠️ اختاري الصف أولًا"
                );

                return;
            }


            // التأكد من الطالبة
            if (!studentName) {

                alert(
                    "⚠️ اختاري اسم الطالبة"
                );

                return;
            }


            // منع الضغط مرتين
            saveButton.disabled = true;

            saveButton.textContent =
                "⏳ جاري الحفظ...";


            const now =
                new Date();


            try {

                await addDoc(
                    collection(
                        db,
                        "lateRecords"
                    ),
                    {

                        studentName:
                            studentName,

                        className:
                            className,

                        reason:
                            reason,

                        date:
                            now.toLocaleDateString(
                                "ar-JO"
                            ),

                        time:
                            now.toLocaleTimeString(
                                "ar-JO"
                            ),

                        teacher:
                            teacherName,

                        createdAt:
                            serverTimestamp()

                    }
                );


                // رسالة نجاح
                successMessage.textContent =
                    "✅ تم تسجيل التأخير بنجاح";

                successMessage.style.color =
                    "green";


                // عدد تأخيرات الطالبة هذا الشهر + التنبيه
                showMonthlyCount(
                    studentName,
                    className
                );


                // إعادة النموذج
                lateForm.reset();

                // إبقاء اسم المعلمة بعد إعادة النموذج
                teacherInput.value = teacherName;


                // إعادة قائمة الطالبات
                studentSelect.innerHTML = "";

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = "";

                option.textContent =
                    "اختاري الصف أولاً";

                studentSelect.appendChild(
                    option
                );

                studentSelect.disabled = true;


                updateTime();


            } catch (error) {

                console.error(
                    "Firebase Error:",
                    error
                );


                successMessage.textContent =
                    "❌ لم يتم حفظ التأخير. تأكدي من اتصال الإنترنت وصلاحيات Firebase.";

                successMessage.style.color =
                    "red";

            }


            // إعادة زر الحفظ
            saveButton.disabled = false;

            saveButton.textContent =
                "💾 حفظ التأخير";

        }
    );

</script>


<footer class="site-footer">

    © جميع الحقوق محفوظة<br>
    تصميم وتطوير سالي موسى العمرات

</footer>

</body>

</html>
